services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cohortquiz
      POSTGRES_PASSWORD: cohortquiz
      POSTGRES_DB: cohortquiz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohortquiz -d cohortquiz"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./services/api-go
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cohortquiz:cohortquiz@db:5432/cohortquiz?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me-use-a-32-char-secret}
      AUTH_URL: http://localhost:3000
      API_GO_URL: http://api:8080
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
